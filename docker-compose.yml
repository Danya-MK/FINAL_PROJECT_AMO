services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 30

  mlflow:
    build: ./docker/mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://airflow:airflow@postgres:5432/mlflow
    volumes:
      - mlflow_artifacts:/mlflow/mlruns
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -lc "
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri $$MLFLOW_BACKEND_STORE_URI
      --default-artifact-root mlflow-artifacts:/
      --serve-artifacts
      --artifacts-destination file:/mlflow/mlruns
      --workers 2
      "

  airflow-init:
    build: ./docker/airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      PYTHONPATH: /opt/airflow

      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _AIRFLOW_WWW_USER_EMAIL: admin@example.com

      TRAIN_DATA_PATH: /opt/airflow/data/train.csv
      CURRENT_DATA_PATH: /opt/airflow/data/current.csv
      DRIFT_THRESHOLD: "0.15"
      DRIFT_FEATURES: fixed acidity,volatile acidity,citric acid,residual sugar,chlorides,free sulfur dioxide,total sulfur dioxide,density,pH,sulphates,alcohol

      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/mlruns
      MLFLOW_ARTIFACT_URI: /mlflow/mlruns

      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: wine_quality_automl_retrain
      MLFLOW_MODEL_NAME: wine_quality_binary_model
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    command: >
      bash -lc "
      airflow db migrate &&
      airflow users create --username "$$\_AIRFLOW_WWW_USER_USERNAME" --password "$$\_AIRFLOW_WWW_USER_PASSWORD" --firstname Admin --lastname User --role Admin --email "$$\_AIRFLOW_WWW_USER_EMAIL" || true"

  airflow-webserver:
    build: ./docker/airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      PYTHONPATH: /opt/airflow

      TRAIN_DATA_PATH: /opt/airflow/data/train.csv
      CURRENT_DATA_PATH: /opt/airflow/data/current.csv
      DRIFT_THRESHOLD: "0.15"
      DRIFT_FEATURES: fixed acidity,volatile acidity,citric acid,residual sugar,chlorides,free sulfur dioxide,total sulfur dioxide,density,pH,sulphates,alcohol

      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/mlruns
      MLFLOW_ARTIFACT_URI: /mlflow/mlruns

      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: wine_quality_automl_retrain
      MLFLOW_MODEL_NAME: wine_quality_binary_model
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: bash -lc "airflow webserver"

  airflow-scheduler:
    build: ./docker/airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      PYTHONPATH: /opt/airflow

      TRAIN_DATA_PATH: /opt/airflow/data/train.csv
      CURRENT_DATA_PATH: /opt/airflow/data/current.csv
      DRIFT_THRESHOLD: "0.15"
      DRIFT_FEATURES: fixed acidity,volatile acidity,citric acid,residual sugar,chlorides,free sulfur dioxide,total sulfur dioxide,density,pH,sulphates,alcohol

      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/mlruns
      MLFLOW_ARTIFACT_URI: /mlflow/mlruns

      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: wine_quality_automl_retrain
      MLFLOW_MODEL_NAME: wine_quality_binary_model
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: bash -lc "airflow scheduler"

  flask-ab:
    build: ./docker/flask
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: wine_quality_binary_model
      AB_LOG_PATH: /app/logs/ab_requests.csv
      AB_B_TRAFFIC: "0.3"
    volumes:
      - ./logs:/app/logs
      - ./src:/app/src
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - mlflow
      - airflow-webserver
    restart: unless-stopped
    command: bash -lc "python -m flask --app src/model_serving_api.py run --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
  mlflow_artifacts: